server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité (déclarés au niveau du serveur uniquement : nginx n'hérite pas
    # des add_header d'un niveau supérieur dès qu'un « location » en déclare un)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fichiers générés par Vite : leur nom contient une empreinte du contenu, cache longue durée.
    # Un fichier absent doit renvoyer 404, pas la page d'accueil.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Pas de fichiers cachés (.env, .git...) même s'il y en avait
    location ~ /\. {
        deny all;
        return 404;
    }

    # Application monopage : toute route React (/login, /files, /folders/123...) renvoie index.html,
    # jamais mis en cache pour que les nouvelles versions soient prises en compte tout de suite
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
